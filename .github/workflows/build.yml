name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén project
        run: unzip -o BlockAuto.zip

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK (debug)
        working-directory: BlockAuto
        run: gradle assembleDebug

      - name: Tải APK lên làm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockAuto-debug-apk
          path: BlockAuto/app/build/outputs/apk/debug/app-debug.apk
